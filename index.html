<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OneUI OS</title>

  <!-- Подключаем официальный JS SDK Telegram Mini Apps — без него не будет доступа к tg.* методам -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Манифест и цвет темы — без них PWABuilder не соберёт APK -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1259C3" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============================================================
       ЭКРАН БЛОКИРОВКИ — первое, что видит пользователь при запуске.
       Свайп вверх (или тап по кнопке) открывает рабочий стол, как на Samsung.
  ============================================================= -->
  <div id="lock-screen" class="screen active lock-screen">
    <div id="lock-wallpaper" class="wallpaper-layer"></div>

    <div class="lock-content">
      <div id="lock-time" class="lock-time">00:00</div>
      <div id="lock-date" class="lock-date">Понедельник, 1 января</div>

      <div class="lock-notifications" id="lock-notifications">
        <!-- Сюда можно выводить последние уведомления из script.js, если понадобится -->
      </div>
    </div>

    <button id="lock-unlock" class="lock-unlock" aria-label="Разблокировать">
      <span class="lock-unlock-arrow">▲</span>
      <span class="lock-unlock-text">Проведите вверх, чтобы разблокировать</span>
    </button>
  </div>

  <!-- ============================================================
       РАБОЧИЙ СТОЛ
  ============================================================= -->
  <div id="desktop" class="screen">

    <!-- Слой обоев — фон под всеми элементами рабочего стола, меняется в Настройках -->
    <div id="wallpaper-layer" class="wallpaper-layer"></div>

    <!-- Статус-бар сверху; тап по нему открывает шторку быстрых настроек -->
    <button id="status-bar" class="status-bar" aria-label="Быстрые настройки">
      <span id="status-time">00:00</span>
      <span class="status-icons">🔋 📶</span>
    </button>

    <!-- ===== ШТОРКА БЫСТРЫХ НАСТРОЕК (выезжает сверху при тапе по статус-бару) ===== -->
    <div id="quick-panel" class="quick-panel">
      <div class="quick-toggles" id="quick-toggles">
        <!-- Кнопки-переключатели генерируются в script.js -->
      </div>
      <div class="quick-brightness">
        <span>🔅</span>
        <input type="range" id="brightness-slider" min="30" max="100" value="100" />
        <span>🔆</span>
      </div>
    </div>

    <!-- Виджет часов (крупные цифры + дата) -->
    <div class="clock-widget">
      <div id="widget-time" class="widget-time">00:00</div>
      <div id="widget-date" class="widget-date">Понедельник, 1 января</div>
    </div>

    <!-- Область страниц рабочего стола: несколько экранов, между которыми свайпаем -->
    <div class="pages-viewport" id="pages-viewport">
      <div class="pages-track" id="pages-track">
        <!-- Каждая .app-grid — отдельная страница, генерируются в script.js -->
      </div>
    </div>

    <!-- Точки-индикаторы текущей страницы, как в Samsung -->
    <div class="page-dots" id="page-dots"></div>

    <!-- Поисковая строка над доком — как на настоящем рабочем столе Samsung -->
    <button id="desktop-search" class="desktop-search" aria-label="Поиск">
      <span>🔍</span>
      <span>Поиск приложений и в интернете</span>
    </button>

    <!-- Нижний док (закреплённые приложения) -->
    <div id="dock" class="dock">
      <!-- Заполняется скриптом -->
    </div>
  </div>

  <!-- ===================== КОНТЕЙНЕР ОКОН ПРИЛОЖЕНИЙ ===================== -->
  <!-- Каждое открытое приложение — это .app-window, добавляемое динамически -->
  <div id="windows-container"></div>

  <!-- ===================== ОБЗОР ОТКРЫТЫХ ПРИЛОЖЕНИЙ (recents) ===================== -->
  <div id="recents-screen" class="recents-screen">
    <div class="recents-header">
      <span class="recents-title">Последние приложения</span>
      <button id="recents-close" class="recents-close" aria-label="Закрыть">✕</button>
    </div>
    <div class="recents-grid" id="recents-grid"></div>
    <p class="recents-empty" id="recents-empty">Нет открытых приложений</p>
  </div>

  <!-- ===================== СИСТЕМНАЯ НАВИГАЦИЯ (как в iPhone — одна полоска вместо кнопок) ===================== -->
  <div class="nav-bar">
    <button id="home-indicator" class="home-indicator" aria-label="Домой (долгий тап — последние приложения)"></button>
  </div>

  <!-- ===================== ШАБЛОН ОКНА (скрыт, клонируется в JS) ===================== -->
  <template id="window-template">
    <div class="app-window">
      <div class="window-titlebar">
        <span class="window-title">Название</span>
        <button class="window-close" aria-label="Закрыть">✕</button>
      </div>
      <div class="window-body"></div>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
